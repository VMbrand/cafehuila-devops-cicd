# Pipeline CI/CD de CaféHuila
#   cualquier push o PR  -> 1 pruebas -> 2 integración Docker -> 3 imágenes + seguridad
#   main                 -> publica artefactos GHCR -> promoción controlada a EC2 -> health check
#
# Secretos (Settings → Secrets and variables → Actions):
#   EC2_HOST     IP o DNS público de la EC2
#   EC2_SSH_KEY  contenido COMPLETO de la llave .pem
name: CI-CD

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write        # para publicar imágenes en ghcr.io con el GITHUB_TOKEN

env:
  REGISTRO: ghcr.io

jobs:
  pruebas:
    name: 1 · Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Pruebas de la API
        working-directory: api
        run: npm test

  integracion:
    name: 2 · Integración Docker
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Levantar API y frontend como en desarrollo
        run: docker compose up --build -d --wait
      - name: Validar contrato de salud y respuesta web
        run: |
          salud=$(curl --fail --silent --show-error --retry 5 --retry-connrefused http://localhost:8080/api/health)
          echo "$salud"
          node -e "const s = JSON.parse(process.argv[1]); if (s.estado !== 'ok') process.exit(1)" "$salud"
          curl --fail --silent --show-error http://localhost:8080/ > /dev/null
      - name: Diagnóstico al fallar
        if: failure()
        run: docker compose logs --no-color
      - name: Apagar entorno efímero
        if: always()
        run: docker compose down -v

  imagenes:
    name: 3 · Imágenes + seguridad
    needs: integracion
    runs-on: ubuntu-latest
    outputs:
      imagen: ${{ steps.nombre.outputs.imagen }}
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen (GHCR exige minúsculas)
        id: nombre
        run: echo "imagen=${REGISTRO}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Construir
        run: |
          # la etiqueta "source" vincula la imagen con este repo en GHCR (hereda sus permisos)
          ORIGEN="org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
          docker build -t ${{ steps.nombre.outputs.imagen }}-api:${{ github.sha }} --label "$ORIGEN" \
                       --build-arg APP_VERSION=${GITHUB_SHA::7} --target prod api
          docker build -t ${{ steps.nombre.outputs.imagen }}-web:${{ github.sha }} --label "$ORIGEN" web

      - name: DevSecOps · escanear vulnerabilidades (falla si hay CRÍTICAS con arreglo)
        run: |
          for img in api web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 \
              image --quiet --exit-code 1 --severity CRITICAL --ignore-unfixed \
              ${{ steps.nombre.outputs.imagen }}-$img:${{ github.sha }}
          done

      - name: Publicar en GHCR (main)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${REGISTRO} -u ${{ github.actor }} --password-stdin
          for img in api web; do
            docker push ${{ steps.nombre.outputs.imagen }}-$img:${{ github.sha }}
          done

  desplegar:
    name: 4 · Desplegar en EC2
    needs: imagenes
    # Las cuentas AWS Project no permiten OIDC y el SSH queda restringido al
    # administrador. En esos casos se usa scripts/promover-a-ec2.ps1.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && vars.DEPLOY_FROM_GITHUB == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: produccion
    concurrency: produccion          # nunca dos despliegues al tiempo
    steps:
      - uses: actions/checkout@v4

      - name: Preparar la llave SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copiar compose.prod.yml y actualizar
        env:
          IMAGEN: ${{ needs.imagenes.outputs.imagen }}
          TAG: ${{ github.sha }}
        run: |
          scp -i ~/.ssh/ec2.pem compose.prod.yml ec2-user@${{ secrets.EC2_HOST }}:app/compose.prod.yml
          ssh -i ~/.ssh/ec2.pem ec2-user@${{ secrets.EC2_HOST }} bash -s <<EOF
            set -e
            cd app
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGEN=${IMAGEN} TAG=${TAG}
            docker compose -f compose.prod.yml pull
            docker compose -f compose.prod.yml up -d --wait
            docker logout ghcr.io
            echo "TAG=${TAG}" > desplegado.env
            docker image prune -af --filter "until=72h"
          EOF

      - name: 5 · Verificar que salió la versión nueva
        run: |
          esperada=${GITHUB_SHA::7}
          for i in $(seq 1 10); do
            real=$(curl -fs http://${{ secrets.EC2_HOST }}/api/health | jq -r .version || true)
            echo "intento $i: en producción=$real esperada=$esperada"
            [ "$real" = "$esperada" ] && exit 0
            sleep 3
          done
          echo "::error::Producción no muestra la versión $esperada"
          exit 1
